name: forge review
description: Deterministic code & security review for any repo — injection sinks, committed secrets, open review findings and QA coverage, as inline PR annotations and a job summary.
author: forge
branding:
  icon: shield
  color: orange
inputs:
  working-directory:
    description: Project root (where forge.config.yaml lives; any repo works without one)
    default: "."
  forge-version:
    description: forge-engine version to run from npm (e.g. 0.5.0). Empty builds forge from this action's checkout.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Prepare forge
      shell: bash
      env:
        FORGE_VERSION: ${{ inputs.forge-version }}
      run: |
        if [ -n "$FORGE_VERSION" ]; then
          echo "FORGE_CLI=npx --yes forge-engine@$FORGE_VERSION" >> "$GITHUB_ENV"
        else
          cd "$GITHUB_ACTION_PATH/../.."
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          echo "FORGE_CLI=node $GITHUB_ACTION_PATH/../../dist/cli.js" >> "$GITHUB_ENV"
        fi
    - name: forge review (security scan, review findings, QA coverage)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: $FORGE_CLI ci check review --format github
