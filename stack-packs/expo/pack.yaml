# Expo (React Native) — iOS, Android (and web) with expo-router.
id: expo
name: Expo (React Native, expo-router)
summary: Native iOS and Android app (plus web) on Expo with file-based expo-router navigation and EAS builds.
kind: app
platforms: [ios, android, web]
depts: [mobile, frontend]
language: typescript
detect:
  packageDeps: [expo]
commands:
  build:
    - run: "{run} build"
      requires: { script: build }
    # Bundles the JS for both native platforms (Hermes bytecode) — no simulator, no Xcode/Gradle.
    - run: "{exec} expo export --platform ios --platform android --output-dir .expo/forge-export"
      requires: { dep: expo }
  test:
    # jest-expo's default `test` script is `jest --watchAll` — always run jest one-shot.
    - run: "{exec} jest --ci --watchAll=false"
      requires: { dep: jest }
    - run: "{run} test"
      requires: { script: test }
  e2e:
    - run: "maestro test .maestro"
      requires: { file: .maestro, bin: maestro }
  lint:
    # `expo lint` installs ESLint when no config exists — a gate must never install packages.
    - run: "{run} lint"
      requires: { script: lint, file: eslint.config.js }
    # expo-env.d.ts (gitignored) is generated by the Expo CLI on `expo start`; tsc fails without it.
    - run: "{exec} tsc --noEmit"
      requires: { dep: typescript, file: expo-env.d.ts }
fixes:
  build: "{exec} expo install expo (the build bundles with `expo export`)"
  test: "{exec} expo install jest-expo jest @testing-library/react-native --dev and set \"jest\": { \"preset\": \"jest-expo\" } in package.json (https://docs.expo.dev/develop/unit-testing/)"
  e2e: "install Maestro (https://docs.maestro.dev) and add flows under .maestro/ — they run against a dev or preview build on a simulator"
  lint: "run `{exec} expo lint` once to create eslint.config.js (with pnpm, then `pnpm approve-builds` if it reports ignored build scripts); for type checks, `{exec} expo start` once generates expo-env.d.ts"
scaffold:
  command: "{dlx} create-expo-app@latest {dir} --template default --yes"
  docs: https://docs.expo.dev/more/create-expo/
  then: []
tokens: ts
qa: Maestro flows in .maestro/ per story (simulator/emulator) plus jest-expo + React Native Testing Library for components.
layout:
  screens: src/app (expo-router file routes; _layout.tsx per stack; older projects use app/)
  components: src/components
  hooks & logic: src/hooks, src/lib
  constants & theme: src/constants
  native config: app.json / app.config.ts, eas.json
  e2e flows: .maestro
docs:
  - https://docs.expo.dev/router/introduction/
  - https://docs.expo.dev/develop/unit-testing/
  - https://docs.expo.dev/build/introduction/
